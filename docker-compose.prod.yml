services:
  database:
    container_name: database
    image: postgres:15.18-trixie
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/data/postgres
    volumes:
      - sql_data:/data/postgres
    ports:
      - 5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    image: ghcr.io/driikzz/blurry:develop
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    ports:
      - 3001:3000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  postgre:

volumes:
  sql_data:
