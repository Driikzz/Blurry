info:
  name: ADD QUESTION TO A QUIZ
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/questions/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: multipart-form
    data:
      - name: statement
        type: text
        value: Quel est le nom de ce film ?
      - name: response
        type: text
        value: Dune
      - name: file
        type: file
        value:
          - Images/dune.webp
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
