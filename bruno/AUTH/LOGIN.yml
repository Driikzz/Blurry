info:
  name: LOGIN
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email":"test@gmail.com",
        "password":"jesuisfortdefou"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const setCookie = res.getHeader("set-cookie");
        const cookieHeader = Array.isArray(setCookie) ? setCookie[0] : setCookie;
        const match = cookieHeader ? /token=([^;]+)/.exec(cookieHeader) : null;
        if (match) {
          bru.setEnvVar("token", match[1]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
