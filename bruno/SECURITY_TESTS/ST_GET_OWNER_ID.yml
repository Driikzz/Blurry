info:
  name: ST_GET_OWNER_ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("ownerUserId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("owner id is captured for later requests", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
