info:
  name: 11 GET GAME RESULT
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/games/:gameId"
  params:
    - name: gameId
      value: "{{gameLoopGameId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("answered round is finished with the current player as winner", function () {
          const game = res.getBody();
          const answeredRound = (game.gameRounds || []).find(
            (round) => round.id === Number(bru.getEnvVar("gameLoopRoundId"))
          );

          expect(res.getStatus()).to.equal(200);
          expect(answeredRound).to.not.be.undefined;
          expect(answeredRound.status).to.equal("FINISHED");
          expect(answeredRound.winnerId).to.equal(
            Number(bru.getEnvVar("gameLoopUserId"))
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pour un quiz avec plusieurs questions, répéter les étapes image et réponse
  avec l'identifiant de la nouvelle manche.
