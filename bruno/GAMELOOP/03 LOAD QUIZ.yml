info:
  name: 03 LOAD QUIZ
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/quiz/:quizId"
  params:
    - name: quizId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const quiz = res.getBody();
          const questions = [...(quiz.questions || [])].sort((a, b) => a.id - b.id);
          bru.setEnvVar("gameLoopQuizId", quiz.id);
          if (questions[0]) {
            bru.setEnvVar("gameLoopCorrectAnswer", questions[0].response);
          }
        }
    - type: tests
      code: |-
        test("quiz contains at least one playable question", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().questions).to.be.an("array").that.is.not.empty;
          expect(bru.getEnvVar("gameLoopCorrectAnswer")).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Remplacer quizId si le quiz 1 n'existe pas ou ne contient aucune question.
