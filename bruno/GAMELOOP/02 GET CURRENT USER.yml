info:
  name: 02 GET CURRENT USER
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("gameLoopUserId", res.getBody().id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
