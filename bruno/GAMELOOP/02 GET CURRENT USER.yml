info:
  name: 02 GET CURRENT USER
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("gameLoopUserId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("current player id is saved", function () {
          expect(res.getStatus()).to.equal(200);
          expect(bru.getEnvVar("gameLoopUserId")).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
